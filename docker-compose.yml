# Infraestructura de desarrollo · Panel de Acuerdos (ADR-001)
# MySQL 8.4 + Redis 7. En producción los puertos NO se publican (doc 04 §A05).
services:
  mysql:
    image: mysql:8.4
    container_name: panel-acuerdos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_local}
      MYSQL_DATABASE: panel_acuerdos
      MYSQL_USER: ${MYSQL_USER:-panel_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_app_local}
      TZ: America/Ciudad_Juarez
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=SYSTEM
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/03-datos/panel_acuerdos_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: panel-acuerdos-redis
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-dev_redis_local}']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-dev_redis_local}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
